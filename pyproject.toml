[tool.importlinter]
# 注意：api/article 等应用在项目根目录（顶层包，非 NCBCNet 子包），故不设置 root_package。
# import-linter 通过 importlib 定位这些顶层包，需把项目根目录加入 sys.path：
#   运行：PYTHONPATH=. lint-imports
# （CI 已在 docker-image.yml 中加 PYTHONPATH=.）

[[tool.importlinter.contracts]]
name = "api 不得导入业务应用的 models（分层边界）"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = ["article.models", "file_save.models", "usermanage.models", "study.models"]

[[tool.importlinter.contracts]]
name = "NCBCNet 分层（api 最顶层，core 共享内核最底层）"
type = "layers"
# 注意：import-linter 的 layers 列表第一项为「最高层」，最后一项为「最低层」。
layers = ["api", "server", "study", "article", "file_save", "usermanage", "core"]
