name: Docker Image CI

on:
  push:
    branches: [ "Deploy" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test --settings=NCBCNet.test_settings
  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: login to ARC
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_NAME }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - uses: actions/checkout@v4
    - name: create tag
      run: |
        git tag v1.0.0
        git push origin v1.0.0
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ncnet
    - name: Save Docker image to tar
      run: docker save ncnet -o image.tar
    - name: Upload Docker image to release
      uses: softprops/action-gh-release@v1
      env:
         GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }}
      with:
        files: image.tar
        tag_name: v1.0.0
        release_name: v1.0.0
        draft: false
        prerelease: false
    - name: bulid and push in ARC
      env:
         IMAGE_TAG: ${{ github.sha }}
      run: |
         docker build -t ${{ secrets.REGISTRY_NAME }}:$IMAGE_TAG .
         docker push ${{ secrets.REGISTRY_NAME }}:$IMAGE_TAG
      



