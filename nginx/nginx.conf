server {
    listen 80;
    server_name ncnetstudent.top www.ncnetstudent.top;
    return 301 https://$host;
}
server {
    client_max_body_size 2G;
    listen 443 ssl http2;
    server_name ncnetstudent.top www.ncnetstudent.top;

    ssl_certificate /etc/letsencrypt/live/ncnetstudent.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncnetstudent.top/privkey.pem;

    # SSL -> HTTP2多路复用
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 转发到 Daphne
    location / {
        proxy_pass https://0.0.0.0:8000;
        proxy_http_version 1.1; # 强制使用HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    # 提供静态文件服务
    location /static/ {
        alias /usr/staticfiles/;
    }
    location /media/ {
        internal;
        alias /usr/mediafiles/;
    }
}