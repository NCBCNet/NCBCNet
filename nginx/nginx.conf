server {
    listen 80;
    server_name ncnetstudent.top www.ncnetstudent.top;
    return 301 https://$host;
}
server {
    # 大文件上传配置
    client_max_body_size 2G; # 文件上传最大大小设置为2GB
    client_body_timeout 300s; # 客户端请求体超时时间
    client_body_buffer_size 128k; # 请求体缓冲区大小

    listen 443 ssl http2;
    server_name ncnetstudent.top www.ncnetstudent.top;

    ssl_certificate /etc/letsencrypt/live/ncnetstudent.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncnetstudent.top/privkey.pem;

    # SSL -> HTTP2多路复用
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 转发到 Daphne
    location / {
        proxy_pass https://0.0.0.0:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传优化
        proxy_request_buffering off; # 禁用请求缓冲，实现流式上传
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
    # 提供静态文件服务
    location /static/ {
        alias /usr/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 公共媒体文件访问（用于预览等）
    location /media/ {
        alias /usr/mediafiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 内部location用于X-Accel-Redirect下载
    # 这个路径不能被外部直接访问
    location /protected/ {
        internal; # 只允许内部重定向访问
        alias /usr/mediafiles/; # 实际文件存储路径

        # 下载优化
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;

        # 确保正确处理 UTF-8 编码的文件名
        charset utf-8;
    }
}