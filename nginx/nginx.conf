# ============================================================================
# NCBCNet production nginx configuration
#
# Serves the built React SPA (copied into the image by docker/nginx.Dockerfile),
# reverse-proxies the Django backend (web:8000) for /api/, /admin/ and the
# editor endpoints, and serves /static/ and /media/ from shared named volumes.
#
# IMPORTANT: every proxy/static/asset location MUST be declared BEFORE the SPA
# catch-all `location /`. nginx selects the longest matching prefix regardless
# of declaration order, but keeping the catch-all last makes the routing
# explicit and prevents future prefix locations from being shadowed.
# ============================================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    # NOTE: server_name can be changed per deployment
    server_name ncnetstudent.top www.ncnetstudent.top;
    return 301 https://$host$request_uri;
}

server {
    # 大文件上传配置
    client_max_body_size 2G;    # 文件上传最大大小设置为2GB
    client_body_timeout 300s;   # 客户端请求体超时时间
    client_body_buffer_size 128k; # 请求体缓冲区大小

    listen 443 ssl http2;
    # NOTE: server_name can be changed per deployment
    server_name ncnetstudent.top www.ncnetstudent.top;

    ssl_certificate /etc/nginx/certs/ncnetstudent.top.pem;
    ssl_certificate_key /etc/nginx/certs/ncnetstudent.top.key;

    # SSL -> HTTP2多路复用
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # TLS 只在 Nginx 终止，内部流量使用 HTTP

    # ------------------------------------------------------------------
    # Django backend routes (all locations before the SPA catch-all)
    # ------------------------------------------------------------------

    # Decoupled API: HttpOnly-cookie JWT + CSRF + signed file downloads.
    # proxy_pass has no URI part, so the original /api/... path is forwarded
    # unchanged to Django.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 大文件上传优化
        proxy_request_buffering off; # 禁用请求缓冲，实现流式上传
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 大文件上传优化
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Markdown editor static assets served by Django
    location /mdeditor/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 大文件上传优化
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # CKEditor 5 static assets served by Django
    location /ckeditor5/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 大文件上传优化
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django collectstatic output (shared named volume, populated by entrypoint)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Raw uploads are NOT exposed directly; downloads must go through the
    # signed /api/v1/files/{id}/download/ endpoint
    location /media/uploads/ {
        return 403;
    }

    # 公共媒体文件访问（用于预览等）
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 内部location用于X-Accel-Redirect下载（外部不可直接访问）
    location /protected/ {
        internal; # 只允许内部重定向访问
        alias /var/www/media/; # 实际文件存储路径

        # 下载优化
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;

        # 确保正确处理 UTF-8 编码的文件名
        charset utf-8;
    }

    # ------------------------------------------------------------------
    # SPA routes
    # ------------------------------------------------------------------

    # Hashed build assets (content-hashed filenames are immutable).
    # Content-Security-Policy: AntD v6 CSS-in-JS injects <style> tags at runtime,
    # hence style-src 'unsafe-inline'; the React bundle is an external file from
    # this same origin, so script-src is 'self' and no other sources are needed.
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';";
    }

    # SPA catch-all: client-side (history-mode) routing -> index.html.
    # MUST come last so it never shadows the proxy/static/asset locations above.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Same Content-Security-Policy as /assets/ (see comment above).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';";
    }
}
