server {
    listen 80 default_server;
    server_name ncnetstudent.top www.ncnetstudent.top;
    return 301 https://$host;
}
server {
    client_max_body_size 500M; # 文件上传最大大小
    listen 443 ssl;
    server_name ncnetstudent.top www.ncnetstudent.top;

    ssl_certificate /etc/letsencrypt/live/ncnetstudent.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncnetstudent.top/privkey.pem;

    # 转发到 Daphne
    location / {
        proxy_pass https://0.0.0.0:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 提供静态文件服务
    location /static/ {
        alias /usr/staticfiles/;
    }
    location /media/ {
        alias /usr/mediafiles/;
    }
}