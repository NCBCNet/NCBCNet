version: '3.8'

services:
  web:
    build:
      context: .
    container_name: ncbcnet-web
    restart: unless-stopped
    volumes:
      - static_data:/usr/staticfiles
      - media_data:/usr/mediafiles
      - ./SECRET:/app/SECRET:ro
      - ./certs:/etc/daphne/certs:ro
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne
             -e ssl:8000:privateKey=/etc/daphne/certs/privkey.pem:certKey=/etc/daphne/certs/fullchain.pem
             NCBCNet.asgi:application"

    ports:
      - "8000:8000"      # 映射 Daphne 服务端口
    environment:
      - DJANGO_SETTINGS_MODULE=NCBCNet.settings
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    container_name: ncbcnet-nginx
    restart: unless-stopped
    ports:
      - "80:80"          # 映射 Nginx HTTP 端口
      - "443:443"        # 映射 Nginx HTTPS 端口
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/staticfiles:ro
      - media_data:/usr/mediafiles:ro
      - ./certs:/www/server/certs:ro


  db:
    image: mysql:8.0
    container_name: ncbcnet-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: ncbcnet-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  db_data:
  redis_data:
  static_data:
  media_data: