[supervisord]
nodaemon=true

[program:daphne]
command=daphne -e ssl:8000:privateKey=/www/server/certs/ncnetstudent.top.key:certKey=/www/server/certs/ncnetstudent.top.pem NCBCNet.asgi:application
directory=/app
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/daphne_stdout.log
stderr_logfile=/var/log/daphne_stderr.log
